[pytest]
# Pytest configuration for semantic search project

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths =
    api/tests
    ingest/tests

# Output options
addopts =
    -v
    --strict-markers
    --tb=short
    --cov=api
    --cov=ingest
    --cov-report=term-missing
    --cov-report=html
    --cov-report=xml

# Markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests

# Ignore paths
norecursedirs =
    .git
    .tox
    dist
    build
    *.egg
    node_modules
    __pycache__

# Async support
asyncio_mode = auto
