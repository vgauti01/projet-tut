# Fichier de configuration pour Grafana, définissant une source de données Prometheus.
# Ce fichier est utilisé pour configurer Grafana afin qu'il puisse se connecter à Prometheus et récupérer les métriques pour les visualiser dans des tableaux de bord.

# Le champ "apiVersion" spécifie la version de l'API utilisée pour la configuration des sources de données dans Grafana.
# La version 1 est la version actuelle et est compatible avec les versions récentes de Grafana.
apiVersion: 1

# Le champ "datasources" est une liste de sources de données que Grafana peut utiliser pour récupérer des données.
datasources:
  # Prometheus est une source de données populaire pour la surveillance et l'observabilité, utilisée pour collecter et stocker des métriques.
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090 # URL de Prometheus, pointant vers le service Prometheus dans le même réseau Docker.
    isDefault: true # Indique que cette source de données est la source par défaut pour les requêtes dans Grafana.
