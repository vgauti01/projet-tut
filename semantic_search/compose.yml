
services:
  meilisearch:
    image: getmeili/meilisearch:v1.12
    environment:
      - MEILI_ENV=production
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY}
    volumes:
      - ./data/indexes/meili:/meili_data
    ports:
      - "7700:7700"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:7700/health"] 
      interval: 5s
      timeout: 2s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.12.1
    ports:
      - "6333:6333"
    volumes:
      - ./data/indexes/qdrant:/qdrant/storage

  api:
    build:
      context: ./api
    command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      - MEILI_URL=http://meilisearch:7700
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY}
      - QDRANT_URL=http://qdrant:6333
      - INDEX_NAME=docs
      - EMBED_MODEL=paraphrase-multilingual-MiniLM-L12-v2
      - RERANK_MODEL=cross-encoder/ms-marco-MiniLM-L-6-v2
      - CORS_ORIGINS=http://localhost:5173
      - TOP_K=5
      - RRF_K=60
      - MIN_SCORE_THRESHOLD=0.01
      - SEARCH_MULTIPLIER=3
    depends_on:
      meilisearch:
        condition: service_healthy
      qdrant:
        condition: service_started
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  ingestor:
    build:
      context: ./ingest
    environment:
      - MEILI_URL=http://meilisearch:7700
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY}
      - INDEX_NAME=docs
      - DOCS_DIR=/workdir/data/docs
      - CHUNK_SIZE=800
      - CHUNK_OVERLAP=200
      - QDRANT_URL=http://qdrant:6333
      - EMBED_MODEL=paraphrase-multilingual-MiniLM-L12-v2
      - RERANK_MODEL=cross-encoder/ms-marco-MiniLM-L-6-v2
    volumes:
      - ./:/workdir
    depends_on:
      meilisearch:
        condition: service_healthy
      qdrant:
        condition: service_started
    command: ["python", "ingest_hybrid.py"]

  frontend:
    build:
      context: ./frontend
    environment:
      - VITE_API_URL=http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - api

  prometheus:
    image: prom/prometheus:v2.48.0
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    ports:
      - "9090:9090"
    depends_on:
      - api

  grafana:
    image: grafana/grafana:10.2.0
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana-dashboards:/etc/grafana/provisioning/dashboards
      - ./grafana-datasources:/etc/grafana/provisioning/datasources
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

  # Node Exporter - System metrics (CPU, RAM, Disk, Network)
  node-exporter:
    image: prom/node-exporter:v1.7.0
    container_name: node-exporter
    command:
      - '--path.rootfs=/host'
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    ports:
      - "9100:9100"
    restart: unless-stopped

  # cAdvisor - Container metrics (Docker/container stats)
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.47.0
    container_name: cadvisor
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  prometheus_data:
  grafana_data:
