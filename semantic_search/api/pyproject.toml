[project]
name = "api"
version = "0.1.0"
description = "Backend API pour la recherche sémantique"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.128.6",
    "uvicorn[standard]>=0.40.0",
    "httpx>=0.28.1",
    "requests>=2.32.5",
    "pydantic>=2.12.5",
    "qdrant-client>=1.12.1",
    "sentence-transformers>=5.2.0",
    "numpy",
    "prometheus-client>=0.19.0",
    "torch",
]

[project.optional-dependencies]
llm = [
    "llama-cpp-python>=0.3.4",
]

[project.scripts]
api = "api.app:serve"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--cov=api --cov-report=term-missing"

[tool.coverage.run]
omit = ["src/api/config.py"]

[build-system]
requires = ["uv_build>=0.9.26,<0.10.0"]
build-backend = "uv_build"
